<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clockify to GitLab /spend</title>
  <style>
    :root {
      --bg: #18191f;
      --card-bg: #23242e;
      --border: #333440;
      --primary: #fc6d26;
      --primary-hover: #e24329;
      --text: #ffffff;
      --text-muted: #9ba1b0;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 26px;
      height: 26px;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .status-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--success);
      background: rgba(16, 185, 129, 0.12);
      padding: 3px 7px;
      border-radius: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .option-row:last-child {
      margin-bottom: 0;
    }

    .option-label {
      font-size: 12.5px;
      color: var(--text);
    }

    .option-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Modern Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3b3c4a;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Live Preview */
    .preview-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #111216;
      border: 1px solid #2d2e38;
      border-radius: 6px;
      padding: 10px;
      color: #60a5fa;
      font-size: 12px;
      word-break: break-all;
      user-select: all;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div class="title">GitLab /spend Copier</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      Active
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settings</div>
    <label class="option-row">
      <div>
        <div class="option-label">Include Seconds</div>
        <div class="option-hint">e.g. 1h 51m 11s vs 1h 51m</div>
      </div>
      <div class="switch">
        <input type="checkbox" id="includeSeconds" checked>
        <span class="slider"></span>
      </div>
    </label>

    <label class="option-row" style="margin-top: 10px;">
      <div>
        <div class="option-label">Round Minutes</div>
        <div class="option-hint">When seconds are omitted (30s+ rounds up)</div>
      </div>
      <div class="switch">
        <input type="checkbox" id="roundMinutes">
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div class="section">
    <div class="section-title">Live Preview</div>
    <div class="preview-box" id="previewBox">/spend 1h 51m 11s 2026-10-21</div>
  </div>

  <div class="footer">
    Works automatically on Clockify time entries.
  </div>

  <script src="popup.js"></script>
</body>
</html>
